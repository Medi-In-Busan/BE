name: Backend CI/CD

# backend/ 변경분이 main에 들어갈 때만 돈다 — Android(:app) 변경은 이 워크플로우와 무관하다.
# workflow_dispatch로 코드 변경 없이 재배포(예: EC2 .env만 바꿨을 때)도 수동으로 트리거할 수 있다.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mediinbusan-backend
  # nginx/Let's Encrypt용 도메인·이메일. 민감정보가 아니라서 Secrets 대신 여기 평문으로 둔다.
  # 도메인의 DNS A 레코드가 EC2_HOST(시크릿)를 가리키도록 사전에 설정돼 있어야 한다(수동, 1회).
  DOMAIN: weddingpick.store
  CERTBOT_EMAIL: gwa7417@gmail.com

jobs:
  # 1) 테스트: 여기서 실패하면 이미지 빌드/배포로 진행하지 않는다.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew
      # backend/CLAUDE.md 테스트 컨벤션대로 H2 in-memory + Flyway 비활성 프로필로 돈다 —
      # 외부 API 키/EC2 시크릿이 CI에 없어도 테스트는 통과해야 한다(계약대로면).
      - run: ./gradlew test --no-daemon

  # 2) 이미지 빌드 + 도커허브 push: 커밋 SHA 태그(롤백용)와 latest 태그를 함께 올린다.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=$(echo ${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) EC2 배포: docker-compose.prod.yml을 서버로 동기화하고, DB 비밀번호/외부 API 키를 포함한
  # .env도 GitHub Secrets에서 매 배포마다 동적으로 생성한다 — EC2에 시크릿 파일을 미리 심어둘
  # 필요가 없다(서버가 초기화돼도 이 워크플로우만 다시 돌리면 재현됨).
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker-compose.prod.yml + nginx 설정을 EC2로 동기화
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/docker-compose.prod.yml,backend/nginx/**"
          target: "~/mediinbusan-deploy"
          strip_components: 1

      - name: EC2에서 .env 생성 + 이미지 pull 후 재기동
        uses: appleboy/ssh-action@v1.2.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          TOURISM_API_SERVICE_KEY: ${{ secrets.TOURISM_API_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          CLOVA_OCR_API_URL: ${{ secrets.CLOVA_OCR_API_URL }}
          CLOVA_OCR_SECRET_KEY: ${{ secrets.CLOVA_OCR_SECRET_KEY }}
          PAPAGO_TRANSLATION_CLIENT_ID: ${{ secrets.PAPAGO_TRANSLATION_CLIENT_ID }}
          PAPAGO_TRANSLATION_CLIENT_SECRET: ${{ secrets.PAPAGO_TRANSLATION_CLIENT_SECRET }}
          DOMAIN: ${{ env.DOMAIN }}
          CERTBOT_EMAIL: ${{ env.CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD,TOURISM_API_SERVICE_KEY,KAKAO_REST_API_KEY,CLOVA_OCR_API_URL,CLOVA_OCR_SECRET_KEY,PAPAGO_TRANSLATION_CLIENT_ID,PAPAGO_TRANSLATION_CLIENT_SECRET,DOMAIN,CERTBOT_EMAIL
          script: |
            set -e
            cd ~/mediinbusan-deploy
            umask 077
            cat > .env <<EOF
            MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
            MYSQL_DATABASE=$MYSQL_DATABASE
            MYSQL_USER=$MYSQL_USER
            MYSQL_PASSWORD=$MYSQL_PASSWORD
            TOURISM_API_SERVICE_KEY=$TOURISM_API_SERVICE_KEY
            KAKAO_REST_API_KEY=$KAKAO_REST_API_KEY
            CLOVA_OCR_API_URL=$CLOVA_OCR_API_URL
            CLOVA_OCR_SECRET_KEY=$CLOVA_OCR_SECRET_KEY
            PAPAGO_TRANSLATION_CLIENT_ID=$PAPAGO_TRANSLATION_CLIENT_ID
            PAPAGO_TRANSLATION_CLIENT_SECRET=$PAPAGO_TRANSLATION_CLIENT_SECRET
            DOMAIN=$DOMAIN
            CERTBOT_EMAIL=$CERTBOT_EMAIL
            EOF
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            export DOMAIN CERTBOT_EMAIL
            docker compose -f docker-compose.prod.yml pull
            # 인증서가 아직 없는 최초 배포에서만 실제로 발급을 수행한다(idempotent) —
            # nginx가 뜨기 전에 먼저 실행해야 standalone 모드로 80번 포트를 쓸 수 있다.
            chmod +x nginx/init-letsencrypt.sh
            ./nginx/init-letsencrypt.sh
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
