# EC2 배포용. 로컬 개발용 docker-compose.yml(MySQL만, H2로 앱 실행)과 달리, 여기서는
# 백엔드 컨테이너까지 도커허브에서 pull해서 함께 띄운다.
#
# 이 파일 자체는 시크릿을 담지 않는다 — 전부 이 파일과 같은 디렉터리의 .env(EC2에만 존재,
# 절대 커밋하지 않음)에서 읽는다. .env에 채워야 하는 값:
#   MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
#   TOURISM_API_SERVICE_KEY, KAKAO_REST_API_KEY
#   CLOVA_OCR_API_URL, CLOVA_OCR_SECRET_KEY
#   PAPAGO_TRANSLATION_CLIENT_ID, PAPAGO_TRANSLATION_CLIENT_SECRET
#   DOMAIN, CERTBOT_EMAIL (nginx/Let's Encrypt용 — 민감정보는 아니지만 다른 값들과 같이 .env로 관리)
# DOCKERHUB_USERNAME과 IMAGE_TAG는 배포 스크립트(.github/workflows/backend-deploy.yml)가
# 매 배포 시점에 셸 환경변수로 채워 넘긴다 — .env에 넣어둘 필요 없다(비워두면 latest로 동작).
#
# 외부에서 들어오는 진입점은 nginx(80/443)뿐이다 — backend는 도커 네트워크 내부에만 노출되고
# 8080을 호스트에 공개하지 않는다(모든 트래픽이 HTTPS로 nginx를 거치도록 강제).
# 인증서 발급은 최초 1회 nginx/init-letsencrypt.sh가 처리한다(idempotent, 재배포마다 호출해도 안전).
services:
  mysql:
    image: mysql:8.4
    container_name: mediinbusan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [mediinbusan]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME}/mediinbusan-backend:${IMAGE_TAG:-latest}
    container_name: mediinbusan-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TOURISM_API_SERVICE_KEY: ${TOURISM_API_SERVICE_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      CLOVA_OCR_API_URL: ${CLOVA_OCR_API_URL}
      CLOVA_OCR_SECRET_KEY: ${CLOVA_OCR_SECRET_KEY}
      PAPAGO_TRANSLATION_CLIENT_ID: ${PAPAGO_TRANSLATION_CLIENT_ID}
      PAPAGO_TRANSLATION_CLIENT_SECRET: ${PAPAGO_TRANSLATION_CLIENT_SECRET}
      TZ: Asia/Seoul
    networks: [mediinbusan]

  nginx:
    image: nginx:1.27-alpine
    container_name: mediinbusan-nginx
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN}
      # 템플릿의 ${DOMAIN}만 치환하도록 제한 — 다른 nginx 변수($host 등)는 그대로 둔다.
      NGINX_ENVSUBST_FILTER: '^DOMAIN$'
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks: [mediinbusan]

  # Let's Encrypt 인증서 자동 갱신 전용 — 발급 자체는 nginx/init-letsencrypt.sh(최초 1회,
  # standalone 모드)가 담당하고, 이 서비스는 12시간마다 renew를 시도하는 상시 루프만 돈다.
  certbot:
    image: certbot/certbot:latest
    container_name: mediinbusan-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"
    networks: [mediinbusan]

networks:
  mediinbusan:

volumes:
  mysql-data:
  certbot-etc:
  certbot-webroot:
