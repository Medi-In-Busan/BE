# 프로필/VM 옵션 아무것도 없어도 항상 로드된다. 지금은 H2만 있음 — 도커/MySQL 없이 바로 실행.
# 실제 MySQL/배포용 설정은 필요해지면 application-{profile}.yml을 따로 추가한다.
spring:
  application:
    name: backend

  datasource:
    url: jdbc:h2:file:./data/mediinbusan-h2;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 로컬 DB에는 이미 적용됐지만 현재 브랜치에서 누락된 V4/V5를 검증 대상에서만 제외한다.
    # V7이 신규 환경에서 V5의 최종 상태(수동 wellness 시드 제거)를 재현한다.
    ignore-migration-patterns: "*:missing"
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

wellness:
  ingestion:
    tour-api-base-url: https://apis.data.go.kr/B551011/KorService2
    accessible-tourism-base-url: https://apis.data.go.kr/B551011/KorWithService2
    related-tourism-base-url: https://apis.data.go.kr/B551011/TarRlteTarService1
    crowding-base-url: https://apis.data.go.kr/B551011/TatsCnctrRateService
    walking-base-url: https://apis.data.go.kr/B551011/Durunubi
    english-tourism-base-url: https://apis.data.go.kr/B551011/EngService2
    japanese-tourism-base-url: https://apis.data.go.kr/B551011/JpnService2
    chinese-tourism-base-url: https://apis.data.go.kr/B551011/ChsService2
    tour-api-service-key: ${TOURISM_API_SERVICE_KEY:}
    kakao-local-base-url: https://dapi.kakao.com
    kakao-navi-base-url: https://apis-navi.kakaomobility.com
    kakao-rest-api-key: ${KAKAO_REST_API_KEY:}
    tour-api-rows-per-type: 30
    kakao-rows-per-keyword: 10
    kakao-keywords:
      - 해운대 카페
      - 해운대 스파
      - 해운대 마사지
      - 부산 온천
      - 부산 산책 공원
      - 부산 웰니스

clova:
  ocr:
    api-url: ${CLOVA_OCR_API_URL:}
    secret-key: ${CLOVA_OCR_SECRET_KEY:}

papago:
  translation:
    # CLOVA OCR과 달리 계정별 커스텀 URL이 아니라 고정된 공개 엔드포인트라 기본값을 박아둔다.
    # 참고: https://api.ncloud-docs.com/docs/en/ai-naver-papagonmt-translation
    api-url: ${PAPAGO_TRANSLATION_API_URL:https://papago.apigw.ntruss.com/nmt/v1/translation}
    client-id: ${PAPAGO_TRANSLATION_CLIENT_ID:}
    client-secret: ${PAPAGO_TRANSLATION_CLIENT_SECRET:}

document:
  ocr:
    # spring.servlet.multipart.max-file-size와 별개로, 우리 서비스가 CLOVA 호출 전에 직접 거절하는 기준값이다.
    max-image-size-bytes: 10485760 # 10MB
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
