plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mediinbusan'
version = '0.0.1-SNAPSHOT'
description = 'MediIn Busan backend skeleton'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	queryDslVersion = '7.5'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Spring Boot 4부터 Flyway 오토컨피그가 spring-boot-autoconfigure에서 분리돼 이 스타터가 따로 필요하다
	// (안 넣으면 FlywayAutoConfiguration 자체가 후보에 안 잡혀서 JPA validate가 "테이블 없음"으로 조용히 실패한다).
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	implementation "io.github.openfeign.querydsl:querydsl-jpa:${queryDslVersion}"
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${queryDslVersion}:jpa"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

	runtimeOnly 'com.mysql:mysql-connector-j:26.7.0'
	// 'h2' 프로필로 도커 없이 로컬 실행할 때도 필요해서 test 스코프가 아니라 runtimeOnly로 둔다.
	runtimeOnly 'com.h2database:h2:2.4.240'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
