# 로컬 성능 확인용 Prometheus + Grafana. 앱은 호스트에서 `./gradlew.bat bootRun`으로 띄우고(관리 포트 8081),
# 이 스택은 host.docker.internal:8081/actuator/prometheus를 긁어간다. 사용법은 monitoring/README.md.
#
# 운영(EC2)에는 아직 올리지 않는다 — 루트 볼륨 8GB에서 디스크 부족으로 배포가 실패한 이력이 있어
# (.github/workflows/backend-deploy.yml 주석) Prometheus TSDB·Grafana 이미지 용량을 먼저 검토해야 한다.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: mediinbusan-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Docker Desktop(Windows/macOS)은 기본 제공, Linux 엔진에서는 이 매핑이 필요하다.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: mediinbusan-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  prometheus-data:
  grafana-data:
